# Blue Loop online: one Worker serves the built game (dist/) and runs the 1v1 rooms.
# Deploy with `npm run deploy` (builds first). Rooms are Durable Objects, one per room code.
name = "blue-loop"
main = "server/worker.ts"
compatibility_date = "2025-09-01"
# Variables set in the Cloudflare dashboard (MAIL_FROM, GOOGLE_CLIENT_ID, APPLE_SERVICE_ID) survive each deploy.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "LADDER"
class_name = "Ladder"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Ladder"]

# Accounts: sign-in, sessions and each account's saved progress (see server/accounts.ts, migrations/).
[[d1_databases]]
binding = "DB"
database_name = "blue-loop-accounts"
database_id = "05efecd8-80f3-4419-9434-8a56ca95ca14"
migrations_dir = "migrations"
