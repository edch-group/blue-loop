<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blue Loop</title>
  <style>
    /* The game fills the window, on the paper it is drawn on; a fine bar while it loads. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f3f2ee; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #f3f2ee; }
    #loading { position: fixed; left: 50%; top: 50%; width: 220px; height: 2px; transform: translate(-50%, -50%); background: rgba(62, 66, 74, 0.12); }
    #loading i { display: block; height: 100%; width: 0; background: #3e424a; transition: width 0.2s; }
    /* Upright, the game waits for the device to be turned sideways (as the web's viewport.ts .rotate-hint). */
    @font-face { font-family: 'Orbitron'; font-weight: 400; src: url('orbitron-400.woff2') format('woff2'); }
    .rotate-hint {
      position: fixed; inset: 0; z-index: 200; display: none; place-items: center; text-align: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, #faf9f6, #f3f2ee 55%, #e0dfdb); font-family: 'Orbitron', system-ui, sans-serif;
    }
    @media (orientation: portrait) { .rotate-hint { display: grid; } }
    .rotate-hint-body { display: grid; justify-items: center; gap: 14px; }
    .rotate-hint h1 { margin: 6px 0 0; font-size: 1.6rem; font-weight: 400; letter-spacing: 0.32em; padding-left: 0.32em; text-transform: uppercase; color: #555a63; }
    .rotate-hint p { margin: 0; font-size: 0.6rem; letter-spacing: 0.24em; text-transform: uppercase; color: #6b7080; }
    .rotate-hint small { margin-top: 14px; font-size: 0.66rem; color: #9aa0ab; letter-spacing: 0.04em; }
    .rotate-phone { width: 34px; height: 58px; border: 2px solid #8a8f99; border-radius: 8px; position: relative; animation: rotatePhone 2.6s ease-in-out infinite; }
    .rotate-phone::after { content: ''; position: absolute; left: 50%; bottom: 4px; width: 8px; height: 2px; margin-left: -4px; border-radius: 1px; background: #8a8f99; }
    @keyframes rotatePhone { 0%, 25% { transform: rotate(0); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
    @media (prefers-reduced-motion: reduce) { .rotate-phone { animation: none; transform: rotate(-90deg); } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><i></i></div>
  <div class="rotate-hint"><div class="rotate-hint-body">
    <div class="rotate-phone" aria-hidden="true"></div>
    <h1>blue loop</h1>
    <p>turn your device sideways to play</p>
    <small>screen not turning? switch off rotation lock</small>
  </div></div>
  <script src="Build/fd78b4ff8f808919931b6921bf3a1a38.loader.js"></script>
  <script>
    const bar = document.querySelector('#loading i');
    // (Lock the screen sideways where that is allowed, Android in full screen; some browsers only after a tap.)
    const lock = () => screen.orientation?.lock?.('landscape').catch(() => undefined);
    lock();
    window.addEventListener('pointerup', lock);
    createUnityInstance(document.querySelector('#unity-canvas'), {
      dataUrl: 'Build/9d23c256da92ca40d0cc3b60e7f9bcad.data.unityweb',
      frameworkUrl: 'Build/287d6d29a27be104eedb246d56bbe3e5.framework.js.unityweb',
      codeUrl: 'Build/48330af41ed7195a196f643a9b3dd91a.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "Blue Loop",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: window.devicePixelRatio || 1,
    }, (p) => { bar.style.width = `${Math.round(p * 100)}%`; })
      .then((game) => { document.getElementById('loading').remove(); window.unityGame = game; })
      .catch((e) => { document.getElementById('loading').textContent = String(e); });
  </script>
</body>
</html>
