<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blue Loop</title>
  <style>
    /* The game fills the window, on the paper it is drawn on; a fine bar while it loads. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f3f2ee; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #f3f2ee; }
    #loading { position: fixed; left: 50%; top: 50%; width: 220px; height: 2px; transform: translate(-50%, -50%); background: rgba(62, 66, 74, 0.12); }
    #loading i { display: block; height: 100%; width: 0; background: #3e424a; transition: width 0.2s; }
    /* Upright, the game waits for the device to be turned sideways (as the web's viewport.ts .rotate-hint). */
    @font-face { font-family: 'Orbitron'; font-weight: 400; src: url('orbitron-400.woff2') format('woff2'); }
    .rotate-hint {
      position: fixed; inset: 0; z-index: 200; display: none; place-items: center; text-align: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, #faf9f6, #f3f2ee 55%, #e0dfdb); font-family: 'Orbitron', system-ui, sans-serif;
    }
    @media (orientation: portrait) { .rotate-hint { display: grid; } }
    .rotate-hint-body { display: grid; justify-items: center; gap: 14px; }
    .rotate-hint h1 { margin: 6px 0 0; font-size: 1.6rem; font-weight: 400; letter-spacing: 0.32em; padding-left: 0.32em; text-transform: uppercase; color: #555a63; }
    .rotate-hint p { margin: 0; font-size: 0.6rem; letter-spacing: 0.24em; text-transform: uppercase; color: #6b7080; }
    .rotate-hint small { margin-top: 14px; font-size: 0.66rem; color: #9aa0ab; letter-spacing: 0.04em; }
    .rotate-phone { width: 34px; height: 58px; border: 2px solid #8a8f99; border-radius: 8px; position: relative; animation: rotatePhone 2.6s ease-in-out infinite; }
    .rotate-phone::after { content: ''; position: absolute; left: 50%; bottom: 4px; width: 8px; height: 2px; margin-left: -4px; border-radius: 1px; background: #8a8f99; }
    @keyframes rotatePhone { 0%, 25% { transform: rotate(0); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
    @media (prefers-reduced-motion: reduce) { .rotate-phone { animation: none; transform: rotate(-90deg); } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><i></i></div>
  <div class="rotate-hint"><div class="rotate-hint-body">
    <div class="rotate-phone" aria-hidden="true"></div>
    <h1>blue loop</h1>
    <p>turn your device sideways to play</p>
    <small>screen not turning? switch off rotation lock</small>
  </div></div>
  <script>
    // The web game's last stages for everything heard (sound.ts build): its master at 0.8, then a gentle limiter
    // (threshold -14 dB, ratio 3) "so swells never clip". The game's own sounds each go straight to the speakers; here
    // whatever would reach them goes through these first. (The game's filter can't run in the browser.)
    (() => {
      const connect = AudioNode.prototype.connect;
      const contexts = new Map();
      AudioNode.prototype.connect = function (dest, ...rest) {
        const ctx = this.context;
        if (!ctx || dest !== ctx.destination) return connect.call(this, dest, ...rest);
        let master = contexts.get(ctx);
        if (!master) {
          master = ctx.createGain();
          master.gain.value = 0.8;
          const comp = ctx.createDynamicsCompressor();
          comp.threshold.value = -14;
          comp.ratio.value = 3;
          connect.call(master, comp);
          connect.call(comp, ctx.destination);
          contexts.set(ctx, master);
        }
        return connect.call(this, master, ...rest);
      };
      // Out of sight (another app, the home screen, a locked phone): everything heard fades to silence over a few
      // hundredths of a second and the audio stops, rather than the phone cutting it off mid-sound (a fizzle); back,
      // it starts and fades up again. (Only if still hidden when the fade is done.)
      document.addEventListener('visibilitychange', () => {
        const hidden = document.visibilityState === 'hidden';
        for (const [ctx, master] of contexts) {
          const now = ctx.currentTime;
          master.gain.cancelScheduledValues(now);
          master.gain.setValueAtTime(master.gain.value, now);
          if (hidden) {
            master.gain.linearRampToValueAtTime(0, now + 0.04);
            setTimeout(() => { if (document.visibilityState === 'hidden') ctx.suspend().catch(() => undefined); }, 80);
          } else {
            if (ctx.state !== 'running') ctx.resume().catch(() => undefined);
            master.gain.linearRampToValueAtTime(0.8, now + 0.15);
          }
        }
      });
    })();
    // The scores (Sound.cs, BlueLoopMusic.jslib): played here, each from its own files (StreamingAssets/Music, made by
    // scripts/score-web.py), the loop set to its exact samples wherever the browser's decoder put the sound, and coming
    // in on the audio clock as the intro ends; only the score sounding held decoded, its intro let go once heard.
    window.blueLoopMusic = (() => {
      const base = 'StreamingAssets/Music/';
      let info = null, front = null;
      const decode = (ctx, file) => fetch(base + file + '.mp3')
        .then((r) => { if (!r.ok) throw new Error(file + ': ' + r.status); return r.arrayBuffer(); })
        .then((b) => new Promise((ok, no) => ctx.decodeAudioData(b, ok, no)));
      // (Where the sound starts in the decoded loop, in seconds: none before it if the browser's decoder took off the
      // encoder's priming, or the priming's length if it left it (MP3's usual, AAC's, or all it added). From there on
      // the loop agrees with itself a loop's length later (its start again, after its end); from earlier it does not
      // (the decoder's silence against the loop's end): the first place it agrees, for its loudness.)
      function lead(buf, n, whole) {
        const d = buf.getChannelData(0), sr = buf.sampleRate, k = sr / 44100, span = n * sr, W = 4096;
        const extra = Math.max(0, Math.round(buf.length - whole * sr));
        const at = [...new Set([0, 529, 576, 1105, 1152, 1634, 2112, 2624].map((p) => Math.round(p * k)).concat(extra))].sort((a, b) => a - b);
        for (const p of at) {
          const q = p + span, qi = Math.floor(q), f = q - qi;
          if (qi + W + 1 >= d.length) continue;
          let e = 0, m = 1e-9;
          for (let i = 0; i < W; i++) {
            const a = d[p + i], b = d[qi + i] * (1 - f) + d[qi + i + 1] * f;
            e += (a - b) * (a - b);
            m += a * a + b * b;
          }
          if (e < 0.1 * m) return p / sr;
        }
        return 0;
      }
      function stop(ctx, now) {
        const s = front;
        front = null;
        if (!s) return;
        s.dead = true;
        clearTimeout(s.timer);
        const t = ctx.currentTime, end = t + (now ? 0.04 : 2);
        s.gain.gain.cancelScheduledValues(t);
        s.gain.gain.setValueAtTime(Math.max(s.gain.gain.value, 0.0001), t);
        s.gain.gain.exponentialRampToValueAtTime(0.0001, end);
        for (const src of s.sources) try { src.stop(end + 0.05); } catch (e) { /* never started */ }
        setTimeout(() => { s.gain.disconnect(); s.sources.length = 0; }, (end - t + 0.2) * 1000);
      }
      function play(ctx, buf, when, offset, loop, s) {
        const src = ctx.createBufferSource();
        src.buffer = buf;
        if (loop) { src.loop = true; src.loopStart = loop[0]; src.loopEnd = loop[1]; }
        src.connect(s.gain);
        src.start(when, offset);
        s.sources.push(src);
        src.onended = () => { src.disconnect(); const i = s.sources.indexOf(src); if (i >= 0) s.sources.splice(i, 1); };
        return src;
      }
      async function start(ctx, scene, reversed, fadeIn) {
        stop(ctx, false);
        const s = { sources: [], gain: ctx.createGain(), t0: -1, lead: 0, n: 0, intro: !reversed, dead: false, timer: 0 };
        front = s;
        s.gain.gain.value = 0.0001;
        s.gain.connect(ctx.destination);
        try {
          info = info || await fetch(base + 'music.json').then((r) => r.json());
          s.n = info.lengths[scene] / info.rate;
          const name = scene + (reversed ? '-reverse' : '');
          // (The loop: decoded as it is wanted, some time before the intro ends, rather than both held at once.)
          const loopIn = async () => {
            const buf = await decode(ctx, name);
            if (s.dead) return;
            s.lead = lead(buf, s.n, s.n + info.margin / info.rate);
            const now = ctx.currentTime;
            if (s.t0 < 0) { s.t0 = now + 0.05; fade(); }
            // (Its sound from where the intro's ends; late, in step with where it would have got to.)
            const at = s.t0 + s.lead + (s.intro ? s.n : 0);
            const when = Math.max(at, now + 0.05);
            play(ctx, buf, when, s.lead + ((when - at) % s.n), [s.lead, s.lead + s.n], s);
          };
          const fade = () => {
            s.gain.gain.setValueAtTime(0.0001, s.t0);
            s.gain.gain.exponentialRampToValueAtTime(1, s.t0 + Math.max(0.05, fadeIn));
          };
          if (!s.intro) return void await loopIn();
          const intro = await decode(ctx, scene + '-intro');
          if (s.dead) return;
          s.t0 = ctx.currentTime + 0.05;
          fade();
          play(ctx, intro, s.t0, 0, null, s);
          s.timer = setTimeout(() => loopIn().catch((e) => console.warn('music', e)), Math.max(0, s.n - 25) * 1000);
        } catch (e) {
          console.warn('music', e);
        }
      }
      // (How far into the score from its top, in seconds, as heard; -1: none sounding yet.)
      const time = (ctx) => (front && front.t0 >= 0 ? Math.max(0, ctx.currentTime - front.t0 - front.lead) : -1);
      return { start, stop, time };
    })();
  </script>
  <script src="Build/e73e4c0fd751acf17f7b26962376d954.loader.js"></script>
  <script>
    const bar = document.querySelector('#loading i');
    // (Lock the screen sideways where that is allowed, Android in full screen; some browsers only after a tap.)
    const lock = () => screen.orientation?.lock?.('landscape').catch(() => undefined);
    lock();
    window.addEventListener('pointerup', lock);
    // The game's data, in pieces when it is too big for the host to serve whole (Cloudflare serves no file over 25 MiB:
    // the publish step splits it, and lists the pieces beside it); fetched together and joined here. The bar shows the
    // download first, then the game's own loading.
    async function gameData() {
      const whole = 'Build/5f94534c324c5d7e6b85fa3298860c41.data.unityweb';
      let parts = null;
      try {
        const r = await fetch(whole + '.parts.json');
        if (r.ok) parts = await r.json();
      } catch (e) { /* none: whole */ }
      if (!parts) return whole;
      const total = parts.reduce((n, p) => n + p.size, 0);
      const got = parts.map(() => 0);
      const show = () => { bar.style.width = `${Math.round(70 * got.reduce((a, b) => a + b, 0) / total)}%`; };
      const pieces = await Promise.all(parts.map(async (p, i) => {
        const r = await fetch('Build/' + p.name);
        if (!r.ok || !r.body) throw new Error(`the game's data (${p.name}): ${r.status}`);
        const reader = r.body.getReader();
        const chunks = [];
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          got[i] += value.length;
          show();
        }
        return new Blob(chunks);
      }));
      // (Unpacked here, by the browser's own gzip as a stream, rather than handed over packed: the game's loader would
      // read the whole of it into memory, packed and unpacked at once, which a phone's tab could not hold.)
      let data = new Blob(pieces);
      if (typeof DecompressionStream === 'function') {
        try { data = await new Response(data.stream().pipeThrough(new DecompressionStream('gzip'))).blob(); }
        catch (e) { /* left packed: the game's loader unpacks it */ }
      }
      return URL.createObjectURL(data);
    }
    gameData().then((dataUrl) => createUnityInstance(document.querySelector('#unity-canvas'), {
      dataUrl,
      frameworkUrl: 'Build/dcbfa09abd865cd4a29f12d985d23bea.framework.js.unityweb',
      codeUrl: 'Build/c59fba2275906750740e4d304599d719.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "Blue Loop",
      productVersion: "0.1.0+2026-10-17",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: window.devicePixelRatio || 1,
    }, (p) => { bar.style.width = `${Math.round((dataUrl.startsWith('blob:') ? 70 + 30 * p : 100 * p))}%`; }))
      // (The game's data, now in its own memory: the page's copy let go, rather than held beside it for as long as
      // the page lives, most of a phone's tab's room, which got the tab thrown out whenever it was left.)
      .then((game) => { document.getElementById('loading').remove(); window.unityGame = game; if (dataUrl.startsWith('blob:')) URL.revokeObjectURL(dataUrl); })
      .catch((e) => { document.getElementById('loading').textContent = String(e); });
  </script>
</body>
</html>
