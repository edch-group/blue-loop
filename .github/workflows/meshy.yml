# Fetches a model from Meshy, so the API key stays a repository secret (MESHY_API_KEY) and never reaches a dev machine
# or agent. To run it, write "<task id or latest> <folder under unity/ModelSources>" into scripts/meshy/request.txt and
# push; the model is committed back to the same branch and the request file is emptied (scripts/meshy/fetch.py).
name: Meshy model

on:
  push:
    paths: [scripts/meshy/request.txt]

permissions:
  contents: write

concurrency:
  group: meshy-${{ github.ref }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read request
        id: req
        run: echo "args=$(tr -s '[:space:]' ' ' < scripts/meshy/request.txt | sed 's/^ *//;s/ *$//')" >> "$GITHUB_OUTPUT"
      - name: Fetch
        if: steps.req.outputs.args != ''
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          ARGS: ${{ steps.req.outputs.args }}
        run: python3 scripts/meshy/fetch.py $ARGS 2>&1 | tee scripts/meshy/last-run.txt
      - name: Commit model
        if: always() && steps.req.outputs.args != ''
        env:
          ARGS: ${{ steps.req.outputs.args }}
        run: |
          : > scripts/meshy/request.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/meshy unity/ModelSources
          git commit -m "Meshy model fetched: $ARGS" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
