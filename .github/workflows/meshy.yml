# Brings models from Meshy into the game, so its API key stays a repository secret (MESHY_API_KEY) and never reaches a dev
# machine or agent. Write lines into scripts/meshy/request.txt and push (scripts/meshy/run.sh says what a line can be):
# each model's originals are kept as a GitHub release (they are far too big for git), it is baked here, and what is
# baked is committed back to the same branch; the request file is emptied.
name: Meshy model

on:
  push:
    paths: [scripts/meshy/request.txt]

permissions:
  contents: write

concurrency:
  group: meshy-${{ github.ref }}

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read request
        id: req
        run: echo "lines=$(grep -c '[^[:space:]]' scripts/meshy/request.txt || true)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.req.outputs.lines != '0'
        with:
          # (Blender's own module, which bakes the Captain, is made for 3.13.)
          python-version: '3.13'
      - name: Tools
        if: steps.req.outputs.lines != '0'
        run: |
          sudo apt-get install -y -q libopengl0 libglu1-mesa libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 > /dev/null
          pip install -q numpy pillow trimesh pymeshlab scipy bpy
      - name: Fetch, keep and bake
        if: steps.req.outputs.lines != '0'
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/meshy/run.sh 2>&1 | tee scripts/meshy/last-run.txt
      - name: Commit what was baked
        if: always() && steps.req.outputs.lines != '0'
        run: |
          req=$(tr -s '[:space:]' ' ' < scripts/meshy/request.txt)
          : > scripts/meshy/request.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/meshy unity/ModelSources unity/Assets/Resources/Models
          git commit -m "Meshy models: $req" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
