# Makes characters' 3D models on fal.ai from their card art, so the API key stays a repository secret.
# To run it, write "<character ids...>" into scripts/model3d/request.txt and push; the models are committed back to
# the same branch and the request file is emptied.
name: 3D models

on:
  push:
    paths: [scripts/model3d/request.txt]

permissions:
  contents: write

concurrency:
  group: model3d-${{ github.ref }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read request
        id: req
        run: echo "args=$(tr -s '[:space:]' ' ' < scripts/model3d/request.txt | sed 's/^ *//;s/ *$//')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.req.outputs.args != ''
        with:
          python-version: '3.12'
      - name: Generate
        if: steps.req.outputs.args != ''
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          ARGS: ${{ steps.req.outputs.args }}
        run: python3 scripts/model3d/generate.py $ARGS
      - name: Commit models
        if: always() && steps.req.outputs.args != ''
        env:
          ARGS: ${{ steps.req.outputs.args }}
        run: |
          : > scripts/model3d/request.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/model3d/request.txt
          for d in scripts/model3d/generated src/assets/models; do [ -e "$d" ] && git add "$d"; done
          git commit -m "3D models generated: $ARGS" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
