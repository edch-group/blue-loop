# Builds the Unity project (unity/) with the Personal licence held as repository secrets (UNITY_LICENSE,
# UNITY_EMAIL, UNITY_PASSWORD), renders a screenshot in the editor as it builds, and commits it back to
# unity/ci/shot.png, so the work can be seen without a Unity install.
name: Unity

on:
  workflow_dispatch:
  push:
    paths: ['unity/**', '.github/workflows/unity.yml', '!unity/ci/**']

permissions:
  contents: write

concurrency:
  group: unity-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: unity-library-${{ hashFiles('unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: unity-library-
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: StandaloneLinux64
          buildMethod: BuildScript.Build
          buildName: Game
      - name: Screenshot
        run: ls -la unity/ci || echo 'no screenshot'
      - name: Commit screenshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sudo chown -R "$(id -u)" unity/ci 2>/dev/null || true
          git add unity/ci
          git commit -m "Unity CI screenshot" || exit 0
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
