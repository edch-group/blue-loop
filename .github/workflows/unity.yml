# Builds the Unity project (unity/) with the Personal licence held as repository secrets (UNITY_LICENSE,
# UNITY_EMAIL, UNITY_PASSWORD), runs the built game on a virtual screen, and commits its screenshot back to
# unity/ci/shot.png, so the work can be seen without a Unity install.
name: Unity

on:
  workflow_dispatch:
  push:
    paths: ['unity/**', '.github/workflows/unity.yml', '!unity/ci/**']

permissions:
  contents: write

concurrency:
  group: unity-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: unity-library-${{ hashFiles('unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: unity-library-
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: StandaloneLinux64
          buildMethod: BuildScript.Build
          buildName: Game
      - name: Run and screenshot
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa > /dev/null
          ls -la build/StandaloneLinux64
          chmod +x build/StandaloneLinux64/Game* || true
          mkdir -p unity/ci
          timeout 120 xvfb-run -s "-screen 0 1280x720x24" build/StandaloneLinux64/Game -force-glcore -screen-width 1280 -screen-height 720 -screen-fullscreen 0 -logFile - -shot "$PWD/unity/ci/shot.png" | tail -40
          ls -la unity/ci
      - name: Commit screenshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unity/ci
          git commit -m "Unity CI screenshot" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
